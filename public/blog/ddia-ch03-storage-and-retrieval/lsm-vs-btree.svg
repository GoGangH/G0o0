<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">LSM과 B 트리: 정리하는 시점의 차이</title><desc id="desc">LSM은 메모리에 모아 파일을 만들고 병합한다. B 트리는 키 범위로 대상 페이지를 찾아 갱신하며 필요하면 분할한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#526b7e"/></marker></defs>
<rect width="900" height="560" rx="18" fill="#fbfaf6"/>
<g font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="36" y="38" font-size="14" fill="#667d8d" font-weight="700">DDIA / READING NOTES</text><text x="36" y="80" font-size="29" fill="#263b4a" font-weight="700">LSM과 B 트리: 정리하는 시점의 차이</text><rect x="36" y="120" width="400" height="100" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="56" y="156" font-size="23" fill="#263b4a" font-weight="700">LSM 계열</text><text x="56" y="194" font-size="18" fill="#263b4a" font-weight="400">쓰기 → 메모리에 모으기 → 정렬 파일</text><rect x="60" y="255" width="110" height="60" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="80" y="293" font-size="21" fill="#263b4a" font-weight="400">파일 A</text><rect x="185" y="255" width="110" height="60" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="205" y="293" font-size="21" fill="#263b4a" font-weight="400">파일 B</text><rect x="310" y="255" width="100" height="60" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="326" y="293" font-size="21" fill="#263b4a" font-weight="400">파일 C</text><path d="M235 325 L235 360" fill="none" stroke="#526b7e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="70" y="370" width="340" height="65" rx="12" fill="#e5eee8" stroke="#d3dce3"/><text x="108" y="411" font-size="23" fill="#263b4a" font-weight="700">병합된 정렬 파일</text><rect x="464" y="120" width="400" height="100" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="484" y="156" font-size="23" fill="#263b4a" font-weight="700">B 트리 계열</text><text x="484" y="194" font-size="18" fill="#263b4a" font-weight="400">쓰기 → 대상 페이지 탐색 → 갱신</text><rect x="575" y="245" width="180" height="55" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="610" y="281" font-size="21" fill="#263b4a" font-weight="400">범위 분기</text><path d="M610 305 L535 345" fill="none" stroke="#526b7e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720 305 L790 345" fill="none" stroke="#526b7e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="485" y="355" width="150" height="80" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="507" y="388" font-size="19" fill="#263b4a" font-weight="400">리프 페이지</text><text x="516" y="417" font-size="17" fill="#263b4a" font-weight="400">키 1 ~ 49</text><rect x="685" y="355" width="150" height="80" rx="12" fill="#f6e7d4" stroke="#d3dce3"/><text x="707" y="388" font-size="19" fill="#263b4a" font-weight="400">갱신할 리프</text><text x="713" y="417" font-size="17" fill="#263b4a" font-weight="400">키 50 ~ 99</text><text x="36" y="493" font-size="19" fill="#263b4a" font-weight="400">공통: WAL·캐시·백그라운드 I/O의 비용도 함께 봐야 한다.</text><text x="36" y="525" font-size="16" fill="#5e7280" font-weight="400">개념도 · 엔진별 구현과 컴팩션 정책에 따라 실제 동작은 달라진다.</text></g></svg>