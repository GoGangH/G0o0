<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">LSM: 먼저 기록하고, 나중에 병합한다</title><desc id="desc">쓰기 요청은 WAL에 기록되고 멤테이블에 반영된다. 멤테이블은 SSTable로 flush되고 파일들은 compaction으로 병합된다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#526b7e"/></marker></defs>
<rect width="900" height="540" rx="18" fill="#fbfaf6"/>
<g font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="36" y="38" font-size="14" fill="#667d8d" font-weight="700">DDIA / READING NOTES</text><text x="36" y="80" font-size="29" fill="#263b4a" font-weight="700">LSM: 먼저 기록하고, 나중에 병합한다</text><rect x="36" y="125" width="220" height="130" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="56" y="161" font-size="23" fill="#263b4a" font-weight="700">01  쓰기 요청</text><text x="56" y="199" font-size="18" fill="#263b4a" font-weight="400">key = user:7</text><text x="56" y="229" font-size="18" fill="#263b4a" font-weight="400">value = 강현</text><path d="M256 190 L325 190" fill="none" stroke="#526b7e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="330" y="125" width="250" height="130" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="350" y="161" font-size="23" fill="#263b4a" font-weight="700">02  WAL 기록</text><text x="350" y="199" font-size="18" fill="#263b4a" font-weight="400">장애 복구용 로그</text><text x="350" y="229" font-size="18" fill="#263b4a" font-weight="400">영구 반영은 동기화 정책에 따름</text><path d="M580 190 L640 190" fill="none" stroke="#526b7e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="645" y="125" width="220" height="130" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="665" y="161" font-size="23" fill="#263b4a" font-weight="700">03  멤테이블</text><text x="665" y="199" font-size="18" fill="#263b4a" font-weight="400">메모리에서 키 정렬</text><text x="665" y="229" font-size="18" fill="#263b4a" font-weight="400">재시작 시 WAL로 복구</text><path d="M755 255 L755 325" fill="none" stroke="#526b7e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="645" y="330" width="220" height="125" rx="12" fill="#e5eee8" stroke="#d3dce3"/><text x="665" y="366" font-size="23" fill="#263b4a" font-weight="700">04  SSTable</text><text x="665" y="404" font-size="18" fill="#263b4a" font-weight="400">정렬된 불변 파일</text><text x="665" y="434" font-size="18" fill="#263b4a" font-weight="400">flush로 새 파일 생성</text><path d="M645 390 L585 390" fill="none" stroke="#526b7e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="330" y="330" width="250" height="125" rx="12" fill="#e5eee8" stroke="#d3dce3"/><text x="350" y="366" font-size="23" fill="#263b4a" font-weight="700">05  컴팩션</text><text x="350" y="404" font-size="18" fill="#263b4a" font-weight="400">정렬 파일 병합</text><text x="350" y="434" font-size="18" fill="#263b4a" font-weight="400">불필요한 옛 버전 정리</text><text x="36" y="360" font-size="23" fill="#263b4a" font-weight="700">쓰기 완료 뒤에도</text><text x="36" y="395" font-size="20" fill="#263b4a" font-weight="400">디스크에서 할 일이 남는다.</text><text x="36" y="505" font-size="17" fill="#5e7280" font-weight="400">개념도 · flush는 메모리를 파일로, compaction은 파일들을 병합하는 작업</text></g></svg>