<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">집계에 필요한 열만 읽을 수 있다면</title><desc id="desc">user, game, amount의 세 행을 행 방향과 열 방향으로 배치한다. amount 합계에서 열 저장은 amount 열에 집중할 수 있다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#526b7e"/></marker></defs>
<rect width="900" height="540" rx="18" fill="#fbfaf6"/>
<g font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="36" y="38" font-size="14" fill="#667d8d" font-weight="700">DDIA / READING NOTES</text><text x="36" y="80" font-size="29" fill="#263b4a" font-weight="700">집계에 필요한 열만 읽을 수 있다면</text><text x="36" y="128" font-size="22" fill="#263b4a" font-weight="700">예시 쿼리: SELECT SUM(amount) FROM purchases</text><text x="36" y="181" font-size="23" fill="#263b4a" font-weight="700">행 지향 배치</text><text x="468" y="181" font-size="23" fill="#263b4a" font-weight="700">열 지향 배치</text><rect x="36" y="205" width="390" height="52" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="56" y="238" font-size="18" fill="#263b4a" font-weight="400">user:1   |   game:A   |   amount:10</text><rect x="36" y="270" width="390" height="52" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="56" y="303" font-size="18" fill="#263b4a" font-weight="400">user:2   |   game:A   |   amount:20</text><rect x="36" y="335" width="390" height="52" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="56" y="368" font-size="18" fill="#263b4a" font-weight="400">user:3   |   game:A   |   amount:30</text><rect x="465" y="205" width="115" height="182" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="482" y="235" font-size="19" fill="#263b4a" font-weight="700">user</text><text x="506" y="275" font-size="21" fill="#263b4a" font-weight="400">1</text><text x="506" y="317" font-size="21" fill="#263b4a" font-weight="400">2</text><text x="506" y="359" font-size="21" fill="#263b4a" font-weight="400">3</text><rect x="594" y="205" width="115" height="182" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="610" y="235" font-size="19" fill="#263b4a" font-weight="700">game</text><text x="635" y="275" font-size="21" fill="#263b4a" font-weight="400">A</text><text x="635" y="317" font-size="21" fill="#263b4a" font-weight="400">A</text><text x="635" y="359" font-size="21" fill="#263b4a" font-weight="400">A</text><rect x="723" y="205" width="141" height="182" rx="12" fill="#e5eee8" stroke="#779485"/><text x="738" y="235" font-size="19" fill="#263b4a" font-weight="700">amount</text><text x="767" y="275" font-size="21" fill="#263b4a" font-weight="400">10</text><text x="767" y="317" font-size="21" fill="#263b4a" font-weight="400">20</text><text x="767" y="359" font-size="21" fill="#263b4a" font-weight="400">30</text><text x="36" y="435" font-size="20" fill="#263b4a" font-weight="400">한 행의 여러 열이 함께 놓인다.</text><text x="468" y="435" font-size="20" fill="#263b4a" font-weight="400">집계할 열의 값이 모여 있다.</text><text x="36" y="495" font-size="16" fill="#5e7280" font-weight="400">배치 원리의 예시 · 실제 I/O 단위와 읽는 양은 압축·블록·실행 계획에 따라 달라진다.</text></g></svg>