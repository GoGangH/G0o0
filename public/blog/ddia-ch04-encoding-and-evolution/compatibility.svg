<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
<title id="title">호환성은 읽는 쪽을 기준으로 본다</title><desc id="desc">하위 호환성은 옛 데이터를 새 코드가 읽는 방향이다. 상위 호환성은 새 데이터를 옛 코드가 읽는 방향이다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#526b7e"/></marker></defs>
<rect width="900" height="540" rx="18" fill="#fbfaf6"/>
<g font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="36" y="38" font-size="14" fill="#667d8d" font-weight="700">DDIA / READING NOTES</text><text x="36" y="80" font-size="29" fill="#263b4a" font-weight="700">호환성은 읽는 쪽을 기준으로 본다</text><text x="36" y="137" font-size="19" fill="#456655" font-weight="700">하위 호환성 / BACKWARD</text><rect x="36" y="157" width="330" height="115" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="56" y="193" font-size="23" fill="#263b4a" font-weight="700">예전 데이터</text><text x="56" y="231" font-size="18" fill="#263b4a" font-weight="400">기존 DB 레코드 · 오래된 메시지</text><path d="M380 214 L515 214" fill="none" stroke="#526b7e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="530" y="157" width="334" height="115" rx="12" fill="#e5eee8" stroke="#d3dce3"/><text x="550" y="193" font-size="23" fill="#263b4a" font-weight="700">새 코드가 읽음</text><text x="550" y="231" font-size="18" fill="#263b4a" font-weight="400">새 코드가 과거 형식을 이해한다</text><text x="36" y="325" font-size="19" fill="#8b6433" font-weight="700">상위 호환성 / FORWARD</text><rect x="36" y="345" width="330" height="115" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="56" y="381" font-size="23" fill="#263b4a" font-weight="700">새 데이터</text><text x="56" y="419" font-size="18" fill="#263b4a" font-weight="400">새 필드가 추가된 레코드 · 메시지</text><path d="M380 402 L515 402" fill="none" stroke="#526b7e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="530" y="345" width="334" height="115" rx="12" fill="#f6e7d4" stroke="#d3dce3"/><text x="550" y="381" font-size="23" fill="#263b4a" font-weight="700">예전 코드가 읽음</text><text x="550" y="419" font-size="18" fill="#263b4a" font-weight="400">모르는 필드를 처리할 수 있어야 한다</text><text x="36" y="510" font-size="18" fill="#5e7280" font-weight="400">파싱 성공과 의미의 호환은 다르다. 단위와 의미도 유지해야 한다.</text></g></svg>