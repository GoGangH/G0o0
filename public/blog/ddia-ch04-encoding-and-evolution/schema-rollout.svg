<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-labelledby="title desc">
<title id="title">필드 이름 변경도 공존 기간이 필요하다</title><desc id="desc">name에서 display_name으로 옮기는 예시. 읽기 호환을 먼저 배포하고 두 필드를 함께 갱신한 다음 데이터를 이행하고 옛 필드를 정리한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#526b7e"/></marker></defs>
<rect width="900" height="550" rx="18" fill="#fbfaf6"/>
<g font-family="Pretendard, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="36" y="38" font-size="14" fill="#667d8d" font-weight="700">DDIA / READING NOTES</text><text x="36" y="80" font-size="29" fill="#263b4a" font-weight="700">필드 이름 변경도 공존 기간이 필요하다</text><rect x="36" y="125" width="390" height="135" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="56" y="161" font-size="23" fill="#263b4a" font-weight="700">01  읽기 호환 먼저 배포</text><text x="56" y="199" font-size="18" fill="#263b4a" font-weight="400">display_name 우선, 없으면 name</text><text x="56" y="229" font-size="18" fill="#263b4a" font-weight="400">쓰기는 기존 필드를 유지한다</text><rect x="474" y="125" width="390" height="135" rx="12" fill="#edf2f5" stroke="#d3dce3"/><text x="494" y="161" font-size="23" fill="#263b4a" font-weight="700">02  두 필드 함께 갱신</text><text x="494" y="199" font-size="18" fill="#263b4a" font-weight="400">읽기 변경 배포 완료 후 전환</text><text x="494" y="229" font-size="18" fill="#263b4a" font-weight="400">신규 쓰기에서 두 값을 일치시킨다</text><path d="M432 190 L468 190" fill="none" stroke="#526b7e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M670 270 L670 320" fill="none" stroke="#526b7e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="474" y="330" width="390" height="135" rx="12" fill="#e5eee8" stroke="#d3dce3"/><text x="494" y="366" font-size="23" fill="#263b4a" font-weight="700">03  기존 데이터 이행</text><text x="494" y="404" font-size="18" fill="#263b4a" font-weight="400">동시 쓰기와의 충돌 처리</text><text x="494" y="434" font-size="18" fill="#263b4a" font-weight="400">누락·값 불일치 확인</text><rect x="36" y="330" width="390" height="135" rx="12" fill="#e5eee8" stroke="#d3dce3"/><text x="56" y="366" font-size="23" fill="#263b4a" font-weight="700">04  옛 필드 정리</text><text x="56" y="404" font-size="18" fill="#263b4a" font-weight="400">구버전 소비자와 재처리 범위 확인</text><text x="56" y="434" font-size="18" fill="#263b4a" font-weight="400">롤백 조건을 정리한 뒤 제거</text><path d="M468 395 L432 395" fill="none" stroke="#526b7e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="36" y="515" font-size="17" fill="#5e7280" font-weight="400">운영 적용 예시 · 각 단계의 배포와 검증이 끝난 뒤 다음 단계로 넘어간다.</text></g></svg>